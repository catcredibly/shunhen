name: Build Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend and native code
        run: |
          npm run typecheck
          npm test
          cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
          cargo test --locked --lib --manifest-path src-tauri/Cargo.toml

      - name: Build Shunhen for Linux
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles appimage,deb

      - name: Verify both Linux package formats
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          appimages=(src-tauri/target/release/bundle/appimage/[Ss]hunhen_*.AppImage)
          debs=(src-tauri/target/release/bundle/deb/[Ss]hunhen_*.deb)

          test "${#appimages[@]}" -gt 0
          test "${#debs[@]}" -gt 0

          for package in "${appimages[@]}"; do
            test -f "$package.sig"
          done

          for package in "${debs[@]}"; do
            test -f "$package.sig"
          done

          for package in "${debs[@]}"; do
            test "$(dpkg-deb -f "$package" Architecture)" = amd64
            test "$(dpkg-deb -f "$package" Package)" = shunhen
            dpkg-deb -x "$package" /tmp/shunhen-deb
            grep -R '^Name=Shunhen$' /tmp/shunhen-deb/usr/share/applications
            desktop=$(find /tmp/shunhen-deb/usr/share/applications -name "*.desktop" -print -quit)
            icon=$(sed -n 's/^Icon=//p' "$desktop")
            test -n "$icon"
            find /tmp/shunhen-deb/usr/share/icons/hicolor -name "$icon.png" -print -quit | grep .
          done

          for package in "${appimages[@]}"; do
            file "$package" | grep 'x86-64'
            chmod +x "$package"
            "$package" --appimage-extract >/dev/null
            test -e squashfs-root/AppRun
            grep -R '^Name=Shunhen$' squashfs-root/usr/share/applications
            find squashfs-root/usr/share/icons -name '*.png' -print -quit | grep .
          done

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-amd64-appimage
          path: |
            src-tauri/target/release/bundle/appimage/Shunhen_*.AppImage
            src-tauri/target/release/bundle/appimage/Shunhen_*.AppImage.sig
          if-no-files-found: error
          compression-level: 0

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-amd64-deb
          path: |
            src-tauri/target/release/bundle/deb/Shunhen_*.deb
            src-tauri/target/release/bundle/deb/Shunhen_*.deb.sig
          if-no-files-found: error
          compression-level: 0
